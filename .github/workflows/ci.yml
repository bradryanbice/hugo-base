# hugo-base dogfoods its own reusable gate against exampleSite.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site
    uses: ./.github/workflows/site-ci.yml
    with:
      source: exampleSite
      lint-dashes: true

  renovate-config:
    name: Renovate config
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.103.2
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Validate renovate.json and the shared preset
        run: |
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict renovate/hugo.json
