# hugo-base dogfoods its own reusable gate against exampleSite.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site
    uses: ./.github/workflows/site-ci.yml
    with:
      source: exampleSite
      lint-dashes: true
