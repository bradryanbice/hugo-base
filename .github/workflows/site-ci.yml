# Reusable CI gate for hugo-base and every site that consumes it.
#
# A site calls it with a short workflow:
#
#   jobs:
#     site:
#       uses: bradryanbice/hugo-base/.github/workflows/site-ci.yml@vX.Y.Z
#
# The workflow carries no Hugo version. The toolchain comes from the caller's
# mise.toml, and the check scripts come from the hugo-base version the caller
# pins in go.mod, so checks always match the base the site actually uses.

name: Site CI

on:
  workflow_call:
    inputs:
      source:
        description: Path of the Hugo project, relative to the repository root.
        type: string
        default: "."
      lint-dashes:
        # Off for consuming sites by decision: it would scan their content,
        # which is the site author's own prose. hugo-base turns it on.
        description: Fail on en or em dashes in any tracked text file.
        type: boolean
        default: false
      lint-dirs:
        description: >
          Directories to run the CSS policy lint over, space separated.
          Defaults to the site itself. hugo-base passes its own root too.
        type: string
        default: ""
      template-coverage:
        description: >
          Fail the build when a template nothing renders is found. Correct for
          hugo-base, wrong for a site: a site that has no images does not
          render the image hook, and that is not an error.
        type: boolean
        default: false
      harness-check:
        description: >
          Assert hugo-base's own harness still exercises every override path.
          Only meaningful in the hugo-base repo.
        type: boolean
        default: false
      lint-self-test:
        description: >
          Also require every policy rule to fire on the lint's broken fixture.
          hugo-base turns this on; a site does not need to re-prove it.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    env:
      SOURCE: ${{ inputs.source }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Restore Hugo cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('**/go.sum', '**/go.mod') }}-${{ github.run_id }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ hashFiles('**/go.sum', '**/go.mod') }}-
            hugo-${{ runner.os }}-

      - name: Locate hugo-base
        id: base
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          # hugo config mounts prints one JSON object per module, including its
          # directory on disk. hugo-base is the one whose go.mod declares it.
          base=""
          for dir in $(hugo config mounts --source "$SOURCE" | jq -r 'select(.dir) | .dir'); do
            if grep -qx 'module github.com/bradryanbice/hugo-base' "$dir/go.mod" 2>/dev/null; then
              base="${dir%/}"
              break
            fi
          done
          if [ -z "$base" ]; then
            echo "::error::could not locate the hugo-base module from $SOURCE"
            exit 1
          fi
          echo "hugo-base found at $base"
          echo "dir=$base" >> "$GITHUB_OUTPUT"

      - name: Check version drift
        run: bash "${{ steps.base.outputs.dir }}/tools/ci/check-versions.sh" .

      - name: Lint for en and em dashes
        if: inputs.lint-dashes
        run: bash "${{ steps.base.outputs.dir }}/tools/ci/lint-dashes.sh"

      - name: Check managed files are current
        run: python3 "${{ steps.base.outputs.dir }}/tools/sync.py" --base "${{ steps.base.outputs.dir }}" --site "$SOURCE" --check

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_BASE_TEMPLATE_COVERAGE: ${{ inputs.template-coverage && '1' || '0' }}
        run: bash "${{ steps.base.outputs.dir }}/tools/ci/build.sh" "$SOURCE"

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ inputs.source }}/public
          if-no-files-found: error
          retention-days: 7

      - name: Migration notice
        # Informational, never a gate: the build, lint and sync checks fail on
        # their own when a migration has not been applied. Needs
        # pull-requests: write in the caller to post, and is skipped quietly
        # when the token cannot (a fork, or a caller that did not grant it).
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_DIR: ${{ steps.base.outputs.dir }}
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          module="github.com/bradryanbice/hugo-base"
          current=$(grep -oE "$module v[0-9.]+" go.mod 2>/dev/null | awk '{print $2}' | head -1)
          previous=$(git show "origin/$GITHUB_BASE_REF:go.mod" 2>/dev/null | grep -oE "$module v[0-9.]+" | awk '{print $2}' | head -1)
          if [ -z "$current" ] || [ -z "$previous" ] || [ "$current" = "$previous" ]; then
            echo "hugo-base version unchanged in this pull request."
            exit 0
          fi
          echo "hugo-base $previous -> $current"
          notice=$(python3 "$BASE_DIR/tools/ci/migration-notice.py" "$BASE_DIR" "$previous" "$current")
          if [ -n "$notice" ]; then
            printf '%s\n' "$notice"
            printf '%s\n' "$notice" | gh pr comment "${{ github.event.pull_request.number }}" --body-file - \
              || echo "could not post the notice (the caller may not grant pull-requests: write)"
          fi

      - name: Harness coverage
        if: inputs.harness-check
        run: bash "${{ steps.base.outputs.dir }}/tools/ci/check-harness.sh" "$SOURCE/public"

      - name: CSS policy lint
        env:
          LINT_DIRS: ${{ inputs.lint-dirs }}
          SELF_TEST: ${{ inputs.lint-self-test }}
        run: |
          dirs="${LINT_DIRS:-$SOURCE}"
          args=""
          [ "$SELF_TEST" = "true" ] && args="--self-test"
          # shellcheck disable=SC2086
          bash "${{ steps.base.outputs.dir }}/tools/lint/run.sh" $args $dirs

      - name: Cache npm downloads for the quality tooling
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/go.sum', '**/go.mod') }}-${{ github.run_id }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('**/go.sum', '**/go.mod') }}-
            npm-${{ runner.os }}-

      - name: Accessibility and Lighthouse
        env:
          REPORT_DIR: ${{ runner.temp }}/quality-reports
        run: bash "${{ steps.base.outputs.dir }}/tools/quality/run.sh" "$SOURCE/public"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: ${{ runner.temp }}/quality-reports
          if-no-files-found: ignore
          retention-days: 7
