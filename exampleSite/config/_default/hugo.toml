# exampleSite is the test harness for hugo-base. Its config/_default/ layout
# mirrors what hugo-starter will ship to new sites.

baseURL = "https://example.org/"
locale = "en-US"
title = "hugo-base example"
copyright = "Example site for hugo-base. MIT licensed."

# Hugo injects its generator tag as the very first element in <head> unless this
# is set, which would put it ahead of <meta charset>. The base emits the
# generator itself, right after charset and viewport.
disableHugoGeneratorInject = true
