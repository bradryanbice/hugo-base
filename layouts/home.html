{{ define "main" }}
  <div class="center stack">
    <div class="prose">
      <h1>{{ site.Title }}</h1>
      {{ .Content }}
    </div>
    {{ with site.RegularPages }}
      <ul role="list">
        {{ range . }}
          <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
      </ul>
    {{ end }}
  </div>
{{ end }}
