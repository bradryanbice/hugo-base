# Deploys exampleSite so every hugo-base PR gets a browsable preview.
# HUGO_VERSION must match mise.toml and CI. Renovate bumps them together.

[build]
  publish = "exampleSite/public"
  command = """
    git config --global core.quotepath false && \
    hugo build --source exampleSite --gc --minify --panicOnWarning --baseURL "${DEPLOY_PRIME_URL}/"
  """

[build.environment]
  HUGO_VERSION = "0.166.0"
  GO_VERSION = "1.27.1"
  TZ = "UTC"
  # Hugo caches processed images here. Netlify persists /opt/build/cache
  # between builds, so images are not reprocessed on every deploy. Without
  # this, a site with many images pays the full processing cost every time.
  HUGO_CACHEDIR = "/opt/build/cache/hugo_cache/"
