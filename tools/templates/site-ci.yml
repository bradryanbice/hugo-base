# Managed by hugo-base. Do not edit this file: change it in the hugo-base repo.
#
# The whole gate (build, toolchain drift, accessibility, Lighthouse, managed
# file check) lives in hugo-base and is pinned to the version in go.mod.
# Renovate bumps that version and this reference together.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # So the gate can post a notice listing the migrations a hugo-base bump
  # crosses.
  #
  # This asks, it does not guarantee. A repository whose Actions setting is
  # "read repository contents" caps the token at read, and the request here
  # cannot exceed that cap, so the notice is logged instead of posted. Nothing
  # fails either way. To let it post:
  #
  #   gh api -X PUT repos/<owner>/<repo>/actions/permissions/workflow \
  #     -f default_workflow_permissions=write
  #
  # Leaving it read only is a reasonable choice: the notice is in the log, and
  # the build, lint and managed file checks fail on their own when a migration
  # has not been applied.
  pull-requests: write

jobs:
  site:
    name: Site
    uses: bradryanbice/hugo-base/.github/workflows/site-ci.yml@__HUGO_BASE_VERSION__
