# Managed by hugo-base. Do not edit this file: change it in the hugo-base repo.
#
# The whole gate (build, toolchain drift, accessibility, Lighthouse, managed
# file check) lives in hugo-base and is pinned to the version in go.mod.
# Renovate bumps that version and this reference together.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # So the gate can post a notice listing the migrations a hugo-base bump
  # crosses. Without it the notice is logged and nothing else changes.
  pull-requests: write

jobs:
  site:
    name: Site
    uses: bradryanbice/hugo-base/.github/workflows/site-ci.yml@__HUGO_BASE_VERSION__
